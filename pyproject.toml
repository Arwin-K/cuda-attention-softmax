[build-system]
requires = ["setuptools>=68", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-attention-softmax"
version = "0.0.0"
description = "Educational research project for fused causal softmax"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cuda_static: CUDA source/test-contract checks that do not execute a device kernel",
]

[tool.setuptools.packages.find]
include = ["cuda_attention*"]
